<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>边境城邦指挥官</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #08090d;
      --panel: #12151c;
      --panel-2: #191e27;
      --line: #2e3a45;
      --text: #f4f7ee;
      --muted: #9aa79b;
      --green: #39ff88;
      --cyan: #50d9ff;
      --gold: #ffd166;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        var(--bg);
      background-size: 24px 24px;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    #joinDialog {
      width: min(380px, calc(100vw - 32px));
      background: var(--panel);
      padding: 28px;
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      z-index: 100;
    }

    #joinDialog h1 {
      margin-bottom: 10px;
      color: var(--green);
      font-size: 28px;
      letter-spacing: 0;
    }

    #joinDialog p {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    #playerNameInput {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      margin-bottom: 14px;
      background-color: #0b0d12;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 4px;
      outline: none;
    }

    #playerNameInput:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(57, 255, 136, 0.16);
    }

    #joinButton {
      width: 100%;
      height: 44px;
      background: var(--green);
      color: #07110c;
      border: 0;
      border-radius: 4px;
      font-weight: 800;
      cursor: pointer;
    }

    .instructions {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }

    #gameContainer {
      display: none;
      width: min(1320px, 100%);
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .playfield {
      min-width: 0;
      position: relative;
    }

    .gameHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .gameTitle {
      color: var(--green);
      font-size: 16px;
      font-weight: 800;
    }

    .quickControls {
      color: var(--muted);
      font-size: 12px;
    }

    #gameCanvas {
      width: min(1000px, calc(100vw - 48px));
      max-width: 100%;
      aspect-ratio: 4 / 3;
      display: block;
      background-color: #171a1f;
      border: 1px solid #536271;
      outline: 3px solid #0d1117;
      box-shadow: 0 0 0 1px rgba(57, 255, 136, 0.25), 0 18px 42px rgba(0, 0, 0, 0.55);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      user-select: none;
    }

    .statusStrip {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      color: var(--text);
      background: rgba(7, 9, 12, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      font-size: 12px;
      pointer-events: none;
    }

    .touchHud {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      display: grid;
      gap: 8px;
      pointer-events: none;
    }

    .modePanel {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      padding: 7px;
      background: rgba(12, 15, 21, 0.9);
      border: 1px solid rgba(57, 255, 136, 0.25);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }

    .actionPanel {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: rgba(12, 15, 21, 0.86);
      border: 1px solid rgba(80, 217, 255, 0.28);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      pointer-events: auto;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .actionPanel::-webkit-scrollbar {
      display: none;
    }

    .touchBtn {
      min-width: 58px;
      height: 38px;
      padding: 0 9px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .modePanel .touchBtn {
      min-width: 0;
      width: 100%;
    }

    .touchBtn:disabled {
      color: var(--muted);
      cursor: default;
    }

    .touchBtn.active {
      color: #07110c;
      background: var(--green);
      border-color: var(--green);
    }

    @media (max-width: 1100px) {
      body {
        align-items: flex-start;
      }

      #gameContainer {
        width: 100%;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .gameHeader {
        display: none;
      }

      #gameCanvas {
        width: calc(100vw - 24px);
        height: calc(100dvh - 24px - env(safe-area-inset-bottom));
        aspect-ratio: auto;
      }

      .touchBtn {
        min-width: 52px;
        height: 34px;
        padding: 0 8px;
        font-size: 12px;
      }

    .statusStrip {
        font-size: 11px;
        flex-direction: column;
      }

      .actionPanel {
        padding-bottom: 6px;
      }
    }
  </style>
</head>
<body>
  <div id="joinDialog">
    <h1>边境城邦指挥官</h1>
    <p>建设城池，经营资源，指挥军队，并在关键时刻亲自带领将领守住战线。</p>
    <input
      type="text"
      id="playerNameInput"
      placeholder="输入统帅名称..."
      maxlength="20"
    >
    <button id="joinButton">开始战役</button>
    <div class="instructions">
      <strong>操作</strong><br>
      点己方单位选择，点地面移动，点敌人或敌方建筑攻击，点资源让工人采集。<br>
      长按拖动地图。点主城、仓库或兵营打开建造/招募操作，城墙可拖动连续建造。
    </div>
  </div>

  <div id="gameContainer">
    <main class="playfield">
      <div class="gameHeader">
        <div class="gameTitle">边境城邦指挥官</div>
        <div class="quickControls">手游优先操作：点击、长按拖动、底部指挥栏。</div>
      </div>
      <canvas id="gameCanvas"></canvas>
      <div class="statusStrip">
        <span id="topStatus">第 1 天 | 选择</span>
        <span id="resourceStatus">粮 0 木 0 石 0 铁 0 金 0</span>
      </div>
      <div class="touchHud">
        <div class="modePanel" id="modePanel"></div>
        <div class="actionPanel" id="actionPanel"></div>
      </div>
    </main>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
