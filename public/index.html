<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>边境城邦指挥官</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #08090d;
      --panel: #12151c;
      --panel-2: #191e27;
      --line: #2e3a45;
      --text: #f4f7ee;
      --muted: #9aa79b;
      --green: #39ff88;
      --cyan: #50d9ff;
      --gold: #ffd166;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }

    body:has(#loginScreen:not([hidden])) {
      overflow: auto;
    }

    button,
    input {
      font: inherit;
    }

    #loginScreen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .login-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(57, 255, 136, 0.12), transparent 55%),
        linear-gradient(180deg, #06080c 0%, #0d1218 45%, #121820 100%);
    }

    .login-layer {
      position: absolute;
      width: auto;
      height: auto;
      max-width: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
      opacity: 0.92;
    }

    .login-layer--castle {
      left: 50%;
      bottom: 18%;
      width: min(92vw, 720px);
      transform: translateX(-52%);
      animation: login-drift-slow 28s ease-in-out infinite alternate;
    }

    .login-layer--village {
      left: -4%;
      bottom: 14%;
      width: min(70vw, 520px);
      opacity: 0.78;
      animation: login-drift-mid 22s ease-in-out infinite alternate-reverse;
    }

    .login-layer--army {
      right: -6%;
      bottom: 12%;
      width: min(68vw, 500px);
      opacity: 0.82;
      animation: login-drift-mid 26s ease-in-out infinite alternate;
    }

    @keyframes login-drift-slow {
      from { transform: translateX(-52%) translateY(0); }
      to { transform: translateX(-48%) translateY(-6px); }
    }

    @keyframes login-drift-mid {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .login-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 40%, transparent 0%, rgba(4, 6, 10, 0.55) 100%),
        linear-gradient(0deg, rgba(4, 6, 10, 0.92) 0%, transparent 38%),
        linear-gradient(180deg, rgba(4, 6, 10, 0.75) 0%, transparent 22%);
      pointer-events: none;
    }

    .login-scanlines {
      position: absolute;
      inset: 0;
      opacity: 0.06;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.45) 2px,
        rgba(0, 0, 0, 0.45) 4px
      );
      pointer-events: none;
    }

    .login-layout {
      position: relative;
      z-index: 2;
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: 1fr min(400px, 100%);
      gap: clamp(20px, 4vw, 48px);
      align-items: center;
    }

    .login-hero {
      padding: 8px 0;
    }

    .login-badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #07110c;
      background: var(--green);
      border-radius: 2px;
    }

    .login-hero h1 {
      margin-bottom: 12px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.15;
      color: var(--text);
      text-shadow: 0 2px 0 #0a0c10, 0 0 24px rgba(57, 255, 136, 0.25);
    }

    .login-hero h1 span {
      color: var(--green);
    }

    .login-tagline {
      max-width: 420px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .login-features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .login-chip {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(80, 217, 255, 0.08);
      border: 1px solid rgba(80, 217, 255, 0.28);
      border-radius: 4px;
    }

    #joinDialog {
      width: 100%;
      padding: 26px 28px 22px;
      background: rgba(12, 15, 21, 0.88);
      border: 1px solid rgba(57, 255, 136, 0.35);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.4),
        0 24px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
    }

    .login-card-title {
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: 800;
      color: var(--green);
    }

    .login-card-desc {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    #playerNameInput {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      margin-bottom: 12px;
      background-color: #0b0d12;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 4px;
      outline: none;
    }

    #playerNameInput:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(57, 255, 136, 0.16);
    }

    #joinButton {
      width: 100%;
      height: 46px;
      background: linear-gradient(180deg, #4dff9a 0%, var(--green) 55%, #2dd66f 100%);
      color: #07110c;
      border: 0;
      border-radius: 4px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1a9a4a, 0 8px 24px rgba(57, 255, 136, 0.25);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    #joinButton:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 0 #1a9a4a, 0 10px 28px rgba(57, 255, 136, 0.35);
    }

    #joinButton:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1a9a4a, 0 4px 12px rgba(57, 255, 136, 0.2);
    }

    .login-secondary {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
    }

    .login-secondary a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 700;
    }

    .login-secondary a:hover {
      text-decoration: underline;
    }

    .instructions {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.75;
    }

    .instructions strong {
      color: var(--text);
      font-size: 12px;
    }

    @media (max-width: 820px) {
      .login-layout {
        grid-template-columns: 1fr;
        max-width: 400px;
      }

      .login-hero {
        text-align: center;
      }

      .login-tagline {
        margin-left: auto;
        margin-right: auto;
      }

      .login-features {
        justify-content: center;
      }

      .login-layer--castle {
        bottom: 22%;
        opacity: 0.7;
      }

      .login-layer--village,
      .login-layer--army {
        opacity: 0.45;
      }
    }

    @media (max-width: 480px) {
      #loginScreen {
        padding: 12px;
        align-items: flex-end;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }

      .login-layer--village,
      .login-layer--army {
        display: none;
      }
    }

    #gameContainer {
      display: none;
      width: min(1320px, 100%);
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .playfield {
      min-width: 0;
      position: relative;
    }

    .gameHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .gameTitle {
      color: var(--green);
      font-size: 16px;
      font-weight: 800;
    }

    .quickControls {
      color: var(--muted);
      font-size: 12px;
    }

    #gameCanvas {
      width: min(1000px, calc(100vw - 48px));
      max-width: 100%;
      aspect-ratio: 4 / 3;
      display: block;
      background-color: #171a1f;
      border: 1px solid #536271;
      outline: 3px solid #0d1117;
      box-shadow: 0 0 0 1px rgba(57, 255, 136, 0.25), 0 18px 42px rgba(0, 0, 0, 0.55);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      user-select: none;
    }

    .statusStrip {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      color: var(--text);
      background: rgba(7, 9, 12, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      font-size: 12px;
      pointer-events: none;
    }

    .touchHud {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      display: grid;
      gap: 8px;
      pointer-events: none;
    }

    .modePanel {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      padding: 7px;
      background: rgba(12, 15, 21, 0.9);
      border: 1px solid rgba(57, 255, 136, 0.25);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }

    .actionPanel {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      padding: 8px;
      max-height: min(38vh, 220px);
      background: rgba(12, 15, 21, 0.92);
      border: 1px solid rgba(80, 217, 255, 0.28);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      pointer-events: auto;
      overflow-x: auto;
      overflow-y: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .actionPanel::-webkit-scrollbar {
      display: none;
    }

    .touchBtn {
      min-width: 58px;
      min-height: 40px;
      height: auto;
      padding: 6px 9px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .recruitBtn {
      min-width: 72px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      line-height: 1.15;
    }

    .recruitBtn .recruitName {
      font-size: 12px;
    }

    .recruitBtn .recruitCost {
      font-size: 10px;
      font-weight: 600;
      color: var(--gold);
    }

    .recruitBtn.unaffordable .recruitCost {
      color: #c96a6a;
    }

    .actionPanel--withDetail {
      flex-direction: column;
      flex-wrap: nowrap;
      max-height: min(48vh, 320px);
    }

    .actionPanelRow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      max-height: min(22vh, 140px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .buildingDetailCard {
      width: 100%;
      flex: 0 0 auto;
      margin-bottom: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--cyan);
      background: linear-gradient(180deg, rgba(80, 217, 255, 0.08), rgba(18, 21, 28, 0.95));
      text-align: left;
    }

    .buildingDetailHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .buildingDetailHead strong {
      font-size: 16px;
      color: var(--cyan);
    }

    .buildingDetailTag {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      color: var(--gold);
      white-space: nowrap;
    }

    .buildingDetailSummary {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .buildingDetailStats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 6px 10px;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--text);
    }

    .buildingDetailEffects {
      margin: 0;
      padding-left: 18px;
      color: #d5e2d8;
      font-size: 12px;
      line-height: 1.5;
    }

    .buildingDetailEffects li + li {
      margin-top: 4px;
    }

    .modePanel .touchBtn {
      min-width: 0;
      width: 100%;
    }

    .touchBtn:disabled {
      color: var(--muted);
      cursor: default;
    }

    .touchBtn.active {
      color: #07110c;
      background: var(--green);
      border-color: var(--green);
    }

    body.game-active {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    @media (max-width: 1100px) {
      body.game-active {
        align-items: flex-start;
      }

      #gameContainer {
        width: 100%;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 8px;
        align-items: stretch;
      }

      #gameContainer {
        width: 100%;
        height: 100dvh;
      }

      .gameHeader {
        display: none;
      }

      #gameCanvas {
        width: 100vw;
        height: calc(100dvh - 120px - env(safe-area-inset-bottom));
        max-height: none;
        aspect-ratio: auto;
      }

      .touchHud {
        left: 6px;
        right: 6px;
        bottom: max(6px, env(safe-area-inset-bottom));
      }

      .modePanel {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .modePanel .touchBtn {
        min-height: 44px;
        font-size: 13px;
      }

      .touchBtn {
        min-width: calc(33% - 8px);
        min-height: 44px;
        padding: 8px 10px;
        font-size: 13px;
      }

      .recruitBtn {
        min-width: calc(50% - 8px);
      }

      .statusStrip {
        font-size: 11px;
        flex-direction: column;
        top: 6px;
        left: 6px;
        right: 6px;
      }

      .actionPanel {
        max-height: min(46vh, 280px);
        padding-bottom: max(6px, env(safe-area-inset-bottom));
      }

      .actionPanel--withDetail {
        max-height: min(52vh, 340px);
      }

      .buildingDetailSummary {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="loginScreen">
    <div class="login-bg" aria-hidden="true">
      <img class="login-layer login-layer--castle" src="/assets/login/bg-castle.svg" alt="" width="320" height="180">
      <img class="login-layer login-layer--village" src="/assets/login/bg-village.svg" alt="" width="320" height="180">
      <img class="login-layer login-layer--army" src="/assets/login/bg-army.svg" alt="" width="320" height="180">
      <div class="login-vignette"></div>
      <div class="login-scanlines"></div>
    </div>

    <div class="login-layout">
      <header class="login-hero">
        <span class="login-badge">PIXEL RTS</span>
        <h1>边境<span>城邦</span>指挥官</h1>
        <p class="login-tagline">
          建设城池、经营粮木铁金，指挥工农与军团。停战五分钟后边境再起波澜——守住你的主城，扫平敌方大本营。
        </p>
        <div class="login-features">
          <span class="login-chip">城池经营</span>
          <span class="login-chip">军团招募</span>
          <span class="login-chip">将领亲征</span>
          <span class="login-chip">自定义地图</span>
        </div>
      </header>

      <div id="joinDialog">
        <div class="login-card-title">进入战役</div>
        <p class="login-card-desc">输入统帅名号，即可部署据点并开启边境征战。</p>
        <input
          type="text"
          id="playerNameInput"
          placeholder="输入统帅名称..."
          maxlength="20"
          autocomplete="nickname"
        >
        <button id="joinButton" type="button">开始战役</button>
        <p class="login-secondary">
          <a href="/map-editor.html">地图编辑器</a>
          <span style="color: var(--muted);"> · 绘制地形并试玩</span>
        </p>
        <div class="instructions">
          <strong>快捷操作</strong><br>
          点选单位 · 点地移动 · 点敌攻击 · 点资源采集<br>
          拖动画布浏览；主城/兵营招募显示资源消耗
        </div>
      </div>
    </div>
  </div>

  <div id="gameContainer">
    <main class="playfield">
      <div class="gameHeader">
        <div class="gameTitle">边境城邦指挥官</div>
        <div class="quickControls">手游优先操作：点击、长按拖动、底部指挥栏。</div>
      </div>
      <canvas id="gameCanvas"></canvas>
      <div class="statusStrip">
        <span id="topStatus">第 1 天 | 选择</span>
        <span id="resourceStatus">粮 0 木 0 石 0 铁 0 金 0</span>
      </div>
      <div class="touchHud">
        <div class="modePanel" id="modePanel"></div>
        <div class="actionPanel" id="actionPanel"></div>
      </div>
    </main>
  </div>

  <script src="main.bundle.js"></script>
</body>
</html>
