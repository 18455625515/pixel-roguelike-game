<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素森林肉鸽</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #08090d;
      --panel: #12151c;
      --panel-2: #191e27;
      --line: #2e3a45;
      --text: #f4f7ee;
      --muted: #9aa79b;
      --green: #39ff88;
      --cyan: #50d9ff;
      --red: #ff5261;
      --gold: #ffd166;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        var(--bg);
      background-size: 24px 24px;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    button,
    input {
      font: inherit;
    }

    #joinDialog {
      width: min(380px, calc(100vw - 32px));
      background: var(--panel);
      padding: 28px;
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      z-index: 100;
    }

    #joinDialog h1 {
      margin-bottom: 10px;
      color: var(--green);
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: 28px;
      letter-spacing: 0;
    }

    #joinDialog p {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    #playerNameInput {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      margin-bottom: 14px;
      background-color: #0b0d12;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 4px;
      outline: none;
    }

    #playerNameInput:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(57, 255, 136, 0.16);
    }

    #joinButton {
      width: 100%;
      height: 44px;
      background: var(--green);
      color: #07110c;
      border: 0;
      border-radius: 4px;
      font-weight: 800;
      cursor: pointer;
    }

    #joinButton:hover {
      background: #63ffa2;
    }

    .instructions {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }

    #gameContainer {
      display: none;
      width: min(1180px, 100%);
      align-items: stretch;
      gap: 16px;
    }

    .playfield {
      min-width: 0;
    }

    .gameHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-family: Consolas, "Microsoft YaHei", monospace;
    }

    .gameTitle {
      color: var(--green);
      font-size: 16px;
      font-weight: 800;
    }

    .quickControls {
      color: var(--muted);
      font-size: 12px;
    }

    .quickControls kbd,
    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 22px;
      padding: 0 7px;
      margin: 0 2px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-bottom-color: #11151b;
      border-radius: 4px;
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: 12px;
    }

    #gameCanvas {
      width: 800px;
      max-width: 100%;
      aspect-ratio: 4 / 3;
      display: block;
      background-color: #171a1f;
      border: 1px solid #536271;
      outline: 3px solid #0d1117;
      box-shadow: 0 0 0 1px rgba(57, 255, 136, 0.25), 0 18px 42px rgba(0, 0, 0, 0.55);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #hud {
      width: 280px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 3px solid var(--cyan);
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-content: start;
    }

    .stat {
      min-height: 52px;
      padding: 10px;
      background: var(--panel-2);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 4px;
    }

    .stat-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: 11px;
    }

    .stat-value {
      color: var(--text);
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: 18px;
      font-weight: 800;
    }

    .stat.health .stat-value {
      color: var(--red);
    }

    .stat.score .stat-value,
    .stat.objective .stat-value {
      color: var(--gold);
    }

    .hudSection {
      padding: 10px;
      color: var(--muted);
      background: #0d1016;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.8;
    }

    .hudSection strong {
      display: block;
      margin-bottom: 6px;
      color: var(--green);
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: 12px;
    }

    @media (max-width: 1100px) {
      body {
        align-items: flex-start;
      }

      #gameContainer {
        flex-direction: column;
      }

      #hud {
        width: 100%;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .hudSection {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .gameHeader {
        align-items: flex-start;
        flex-direction: column;
      }

      #hud {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stat-value {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="joinDialog">
    <h1>像素森林肉鸽</h1>
    <p>进入森林，击杀足够数量的敌人推进波次。升级会强化属性，并在 3/5/7 级自动解锁新武器。</p>
    <input
      type="text"
      id="playerNameInput"
      placeholder="输入玩家名称..."
      maxlength="20"
    >
    <button id="joinButton">进入游戏</button>
    <div class="instructions">
      <strong>操作说明</strong><br>
      WASD 或方向键：移动<br>
      空格 或 J：朝当前方向攻击<br>
      击杀敌人获得经验，拾取掉落物强化属性
    </div>
  </div>

  <div id="gameContainer">
    <main class="playfield">
      <div class="gameHeader">
        <div class="gameTitle">森林远征</div>
        <div class="quickControls">
          移动 <kbd>WASD</kbd>/<kbd>方向键</kbd> 攻击 <kbd>空格</kbd>/<kbd>J</kbd>
        </div>
      </div>
      <canvas id="gameCanvas"></canvas>
    </main>

    <aside id="hud">
      <div class="stat health">
        <span class="stat-label">生命</span>
        <span class="stat-value" id="health">生命 100/100</span>
      </div>
      <div class="stat">
        <span class="stat-label">等级</span>
        <span class="stat-value" id="level">等级 1</span>
      </div>
      <div class="stat">
        <span class="stat-label">经验</span>
        <span class="stat-value" id="xp">经验 0/100</span>
      </div>
      <div class="stat">
        <span class="stat-label">武器</span>
        <span class="stat-value" id="weapon">生锈短剑</span>
      </div>
      <div class="stat">
        <span class="stat-label">伤害</span>
        <span class="stat-value" id="damage">伤害 10</span>
      </div>
      <div class="stat">
        <span class="stat-label">攻击范围</span>
        <span class="stat-value" id="range">范围 52</span>
      </div>
      <div class="stat">
        <span class="stat-label">护甲</span>
        <span class="stat-value" id="armor">护甲 0</span>
      </div>
      <div class="stat">
        <span class="stat-label">波次</span>
        <span class="stat-value" id="wave">第 1 波</span>
      </div>
      <div class="stat objective">
        <span class="stat-label">本波目标</span>
        <span class="stat-value" id="objective">0/9</span>
      </div>
      <div class="stat score">
        <span class="stat-label">分数</span>
        <span class="stat-value" id="score">分数 0</span>
      </div>
      <div class="stat">
        <span class="stat-label">场上敌人</span>
        <span class="stat-value" id="enemyCount">0</span>
      </div>
      <div class="hudSection">
        <strong>玩法规则</strong>
        攻击只会命中当前朝向前方的敌人。被敌人碰到会受到一次伤害，然后该敌人进入短暂攻击冷却。
      </div>
    </aside>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
